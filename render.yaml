services:
  - type: web
    name: captain-bot
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: BOT_NAME
        value: Captain XMD
      - key: PREFIX
        value: "."
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: WHATSAPP_PAIRING_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: WHATSAPP_SESSION_ENCRYPTION_KEY
        sync: false
