services:
  - type: web
    name: captain-xmd
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: MAX_SESSIONS
        value: "100"
      - key: BOT_NAME
        value: Captain-XMD
      - key: PREFIX
        value: "."
